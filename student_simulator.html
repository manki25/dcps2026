<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Load Simulator</title><script src="https://unpkg.com/mqtt@5.6.1/dist/mqtt.min.js"></script><style>body{margin:0;font-family:system-ui;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:16px}.wrap{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.route{display:grid;grid-template-columns:1fr 110px 100px;gap:8px;align-items:center;margin:8px 0}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:8px;padding:10px 12px;background:#2563eb;color:#fff;font-weight:700}.secondary{background:#475569}.danger{background:#b91c1c}.ok{background:#15803d}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{float:right;background:#334155;padding:6px 9px;border-radius:999px;font-size:12px}.log{height:260px;overflow:auto;background:#0f172a;color:#dbeafe;padding:10px;border-radius:10px;font:12px monospace}.bar{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#2563eb;width:0}.muted{color:#64748b;font-size:13px}dialog{border:0;border-radius:14px;width:min(500px,90%)}@media(max-width:700px){.grid{grid-template-columns:1fr}.route{grid-template-columns:1fr 90px 85px}}</style></head><body><header><div class="wrap" style="padding:0"><span id="conn" class="pill">Offline</span><b>Student Load Simulator</b><div style="font-size:12px;color:#cbd5e1">Publishes simulated route choices to the original instructor page</div></div></header><main class="wrap"><section class="panel"><div class="grid"><label>First numeric ID<input id="start" type="number" value="1001"></label><label>Last numeric ID<input id="end" type="number" value="1075"></label><label>ID prefix<input id="prefix" value="SIM-"></label><label>Delay between students<select id="delay"><option value="100">0.1 sec</option><option value="250">0.25 sec</option><option value="500" selected>0.5 sec</option><option value="1000">1 sec</option><option value="2000">2 sec</option></select></label></div><h3>Route proportions</h3><div class="route"><b>R1 — EEH–JVLR</b><input id="p1" type="number" value="50" min="0"><span id="c1" class="muted"></span></div><div class="route"><b>R2 — Mulund–Airoli</b><input id="p2" type="number" value="25" min="0"><span id="c2" class="muted"></span></div><div class="route"><b>R3 — LBS–Vikhroli</b><input id="p3" type="number" value="15" min="0"><span id="c3" class="muted"></span></div><div class="route"><b>R4 — Ghodbunder–WEH</b><input id="p4" type="number" value="10" min="0"><span id="c4" class="muted"></span></div><div id="summary" class="muted"></div><div class="row" style="margin-top:12px"><button id="startBtn" class="ok">Start simulation</button><button id="pauseBtn" class="secondary" disabled>Pause</button><button id="stopBtn" class="danger" disabled>Stop</button><button id="previewBtn" class="secondary">Preview</button></div><div class="bar" style="margin-top:12px"><div id="progress"></div></div><div id="status" class="muted" style="margin-top:6px">Ready.</div></section><section class="panel"><div class="row"><button id="settingsBtn" class="secondary">MQTT settings</button><button id="reconnectBtn">Reconnect</button><button id="clearBtn" class="secondary">Clear log</button></div><div id="log" class="log" style="margin-top:12px"></div></section></main><dialog id="dlg"><form id="form"><h3>MQTT settings</h3><label>Broker host<input id="host" value="mcdcc0c1.ala.asia-southeast1.emqxsl.com"></label><label>WSS port<input id="port" value="8084"></label><label>Username<input id="user"></label><label>Password<input id="pass" type="password"></label><label>Session<input id="session" value="CLASS01"></label><div class="row" style="margin-top:10px"><button type="button" id="cancel" class="secondary">Cancel</button><button>Save and connect</button></div></form></dialog><script>
const $=x=>document.getElementById(x);let client=null,queue=[],timer=null,sent=0,paused=false;function cfg(){try{return JSON.parse(localStorage.simcfg||'{}')}catch{return{}}}function topic(){return`dcps/traffic/${cfg().session.toUpperCase()}/selection`}function log(s){let d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${s}`;$('log').prepend(d)}function openDlg(){let c=cfg();['host','port','user','pass','session'].forEach(k=>{if(c[k])$(k).value=c[k]});$('dlg').showModal()}function connect(){let c=cfg();if(!c.host||!c.user||!c.pass||!c.session)return openDlg();client?.end(true);$('conn').textContent='Connecting';client=mqtt.connect(`wss://${c.host}:${c.port}/mqtt`,{username:c.user,password:c.pass,clientId:'sim_'+Date.now(),reconnectPeriod:1500,connectTimeout:30000});client.on('connect',()=>{$('conn').textContent='Connected';log('Connected')});client.on('reconnect',()=>$('conn').textContent='Reconnecting');client.on('error',e=>log('Error: '+e.message))}function counts(total,ps){let sum=ps.reduce((a,b)=>a+b,0),exact=ps.map(p=>total*p/sum),out=exact.map(Math.floor),rem=total-out.reduce((a,b)=>a+b,0),ord=exact.map((v,i)=>({i,r:v-out[i]})).sort((a,b)=>b.r-a.r);for(let k=0;k<rem;k++)out[ord[k%4].i]++;return out}function preview(){let a=+$('start').value,b=+$('end').value,total=b>=a?b-a+1:0,ps=[1,2,3,4].map(i=>Math.max(0,+$('p'+i).value||0)),sum=ps.reduce((x,y)=>x+y,0),cs=sum?counts(total,ps):[0,0,0,0];cs.forEach((c,i)=>$('c'+(i+1)).textContent=c+' students');$('summary').textContent=`${total} students; entered proportions total ${sum}% (normalized automatically)`;return{a,b,total,cs,sum}}function build(){let x=preview();if(!x.total||!x.sum)throw Error('Check ID range and proportions');let rs=[];x.cs.forEach((c,i)=>{for(let j=0;j<c;j++)rs.push('R'+(i+1))});for(let i=rs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[rs[i],rs[j]]=[rs[j],rs[i]]}queue=[];for(let id=x.a;id<=x.b;id++)queue.push({studentId:$('prefix').value+id,studentName:$('prefix').value+id,routeId:rs[id-x.a]})}function update(){let total=sent+queue.length,p=total?Math.round(sent/total*100):0;$('progress').style.width=p+'%';$('status').textContent=timer||paused?`${sent}/${total} published (${p}%)`:sent&&!queue.length?`Completed: ${sent} students`:'Ready.'}function next(){if(paused)return;if(!queue.length)return finish();let s=queue.shift();s.timestamp=new Date().toISOString();client.publish(topic(),JSON.stringify(s),{qos:1},e=>{if(!e){sent++;log(`${s.studentId} → ${s.routeId}`)}update()})}function start(){if(!client?.connected)return alert('Connect MQTT first');try{build()}catch(e){return alert(e.message)}sent=0;paused=false;$('startBtn').disabled=true;$('pauseBtn').disabled=false;$('stopBtn').disabled=false;next();timer=setInterval(next,+$('delay').value);update()}function finish(){clearInterval(timer);timer=null;$('startBtn').disabled=false;$('pauseBtn').disabled=true;$('stopBtn').disabled=true;update();log('Simulation complete')}function stop(){clearInterval(timer);timer=null;queue=[];$('startBtn').disabled=false;$('pauseBtn').disabled=true;$('stopBtn').disabled=true;update();log('Simulation stopped')}
$('form').onsubmit=e=>{e.preventDefault();localStorage.simcfg=JSON.stringify({host:$('host').value,port:$('port').value,user:$('user').value,pass:$('pass').value,session:$('session').value});$('dlg').close();connect()};$('cancel').onclick=()=>$('dlg').close();$('settingsBtn').onclick=openDlg;$('reconnectBtn').onclick=connect;$('clearBtn').onclick=()=>$('log').innerHTML='';$('previewBtn').onclick=preview;$('startBtn').onclick=start;$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'Resume':'Pause';update()};$('stopBtn').onclick=stop;['start','end','p1','p2','p3','p4'].forEach(id=>$(id).oninput=preview);preview();connect();
</script></body></html>
