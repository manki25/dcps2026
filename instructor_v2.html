<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instructor V2</title><script src="https://unpkg.com/mqtt@5.6.1/dist/mqtt.min.js"></script><style>
body{margin:0;font-family:system-ui;background:#06101d;color:#fff}header{padding:14px 18px;background:#0d1b2e;position:sticky;top:0}.head{display:flex;justify-content:space-between}.pill{background:#334155;padding:6px 10px;border-radius:999px;font-size:12px}.wrap{max-width:1250px;margin:auto;padding:15px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat,.panel{background:#0d1b2e;border:1px solid #1e3652;border-radius:16px;padding:14px}.n{font-size:25px;font-weight:800}.muted{color:#93a4ba;font-size:12px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-top:14px}.mapgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}svg{width:100%}.edge{fill:none;stroke:#06101d;stroke-width:24;stroke-linecap:round}.road{fill:none;stroke-width:16;stroke-linecap:round}.bar{height:12px;background:#1e293b;border-radius:99px;overflow:hidden}.fill{height:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button{border:0;border-radius:9px;padding:9px 11px;background:#0ea5e9;color:white;font-weight:700}.secondary{background:#334155}.danger{background:#dc2626}.warn{background:#d97706}.ok{background:#15803d}input,select{width:100%;padding:9px;margin:4px 0 9px;background:#07111f;color:white;border:1px solid #334155;border-radius:8px}.switch{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e3652}.switch input{width:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #1e3652;text-align:left}dialog{background:#0d1b2e;color:white;border:0;border-radius:16px;width:min(500px,90%)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.layout,.mapgrid{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><b>🛰 Instructor Console V2</b><span id="conn" class="pill">Offline</span></div></header><div class="wrap"><div class="stats"><div class="stat"><div id="sn" class="n">0</div><div class="muted">Students</div></div><div class="stat"><div id="avg" class="n">0</div><div class="muted">Average minutes</div></div><div class="stat"><div id="tot" class="n">0</div><div class="muted">System minutes</div></div><div class="stat"><div id="best" class="n">—</div><div class="muted">Fastest route</div></div><div class="stat"><div id="rnd" class="n">1</div><div class="muted">Round</div></div></div><div class="layout"><div><div class="panel"><h3>Live traffic digital twin</h3><div class="mapgrid"><svg viewBox="0 0 640 410"><circle cx="320" cy="42" r="10" fill="white"/><text x="338" y="48" fill="white">Thane</text><circle cx="320" cy="370" r="10" fill="white"/><text x="338" y="376" fill="white">Powai</text><path class="edge" d="M320 42 C170 70 145 160 165 230 C180 280 245 330 320 370"/><path id="R1p" class="road" d="M320 42 C170 70 145 160 165 230 C180 280 245 330 320 370"/><path class="edge" d="M320 42 C450 70 500 145 475 215 C455 275 390 330 320 370"/><path id="R2p" class="road" d="M320 42 C450 70 500 145 475 215 C455 275 390 330 320 370"/><path class="edge" d="M320 42 C250 95 235 160 250 225 C265 285 285 330 320 370"/><path id="R3p" class="road" d="M320 42 C250 95 235 160 250 225 C265 285 285 330 320 370"/><path class="edge" d="M320 42 C385 95 400 160 388 225 C378 285 350 330 320 370"/><path id="R4p" class="road" d="M320 42 C385 95 400 160 388 225 C378 285 350 330 320 370"/></svg><div id="bars"></div></div></div><div class="panel" style="margin-top:14px"><h3>Latest selections</h3><table><thead><tr><th>Student</th><th>Route</th><th>Time</th></tr></thead><tbody id="tb"></tbody></table></div></div><aside><div class="panel"><h3>Round controls</h3><div class="row"><button id="toggle">Close selection</button><button id="next" class="secondary">Next round</button></div><div class="row"><button id="pub">Publish</button><button id="reset" class="danger">Reset</button></div><div class="switch"><span>Reveal counts</span><input id="reveal" type="checkbox"></div><div class="switch"><span>AI recommendation</span><input id="ai" type="checkbox"></div><label class="muted">Message</label><input id="msg"></div><div class="panel" style="margin-top:14px"><h3>Incidents</h3><select id="route"></select><select id="itype"><option>Heavy rain</option><option>Accident</option><option>Waterlogging</option><option>Roadworks</option><option>VIP movement</option></select><input id="delay" type="number" value="20"><div class="row"><button id="apply" class="warn">Apply</button><button id="clear" class="secondary">Clear</button></div><div class="row"><button id="close" class="danger">Close route</button><button id="open" class="ok">Reopen</button></div></div><div class="panel" style="margin-top:14px"><div class="muted">Session: <b id="sess">—</b></div><div class="row"><button id="settings" class="secondary">Settings</button><button id="reconnect">Reconnect</button></div></div></aside></div></div><dialog id="dlg"><form id="form"><h3>MQTT settings</h3><input id="host" value="mcdcc0c1.ala.asia-southeast1.emqxsl.com"><input id="port" value="8084"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><input id="session" value="CLASS01"><button>Save and connect</button></form></dialog><script>
const $=x=>document.getElementById(x),base=[{id:"R1",name:"EEH–JVLR",freeFlow:45,capacity:18,toll:0},{id:"R2",name:"Mulund–Airoli",freeFlow:50,capacity:24,toll:45},{id:"R3",name:"LBS–Vikhroli",freeFlow:55,capacity:28,toll:0},{id:"R4",name:"Ghodbunder–WEH",freeFlow:65,capacity:35,toll:70}];let client,students={},open=true,reveal=false,showAI=false,round=1,message="",inc={};function cfg(){return JSON.parse(localStorage.tpv2icfg||"{}")}function topic(k){return`dcps/traffic/${cfg().session.toUpperCase()}/${k}`}function col(s,c){if(c)return"#64748b";s=s.toLowerCase();return s.includes("light")?"#22c55e":s.includes("moderate")?"#facc15":s.includes("heavy")?"#fb923c":"#ef4444"}function stats(){let count=Object.fromEntries(base.map(r=>[r.id,0]));Object.values(students).forEach(s=>count[s.routeId]++);return base.map(r=>{let v=count[r.id],x=inc[r.id]||{},ratio=v/r.capacity,t=Math.round(r.freeFlow*(1+.8*ratio*ratio)+(x.delay||0)),status=ratio<.45?"Light":ratio<.85?"Moderate":ratio<1.2?"Heavy":"Severe";if(x.closed){t=999;status="Closed"}return{...r,vehicles:v,travelTime:t,status,incident:x.label||"",closed:!!x.closed}})}function payload(){return{round,open,revealCounts:reveal,showAI,message,routes:stats()}}function publish(){if(client?.connected)client.publish(topic("status"),JSON.stringify(payload()),{qos:1,retain:true});render()}function render(){let rs=stats(),n=Object.keys(students).length,total=rs.reduce((s,r)=>s+(r.closed?0:r.travelTime*r.vehicles),0),b=rs.filter(r=>!r.closed).sort((a,b)=>a.travelTime-b.travelTime)[0];$("sn").textContent=n;$("avg").textContent=n?Math.round(total/n):0;$("tot").textContent=total;$("best").textContent=b?b.id:"—";$("rnd").textContent=round;$("toggle").textContent=open?"Close selection":"Open selection";$("reveal").checked=reveal;$("ai").checked=showAI;$("msg").value=message;$("sess").textContent=cfg().session||"—";rs.forEach(r=>$(r.id+"p").style.stroke=col(r.status,r.closed));$("bars").innerHTML=rs.map(r=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>${r.id} ${r.name}</b><span>${r.closed?"Closed":r.travelTime+" min"} · ${r.vehicles}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,r.vehicles/r.capacity*100)}%;background:${col(r.status,r.closed)}"></div></div><div class="muted">${r.status}${r.incident?" · "+r.incident:""} · cap ${r.capacity}${r.toll?" · ₹"+r.toll:""}</div></div>`).join("");$("tb").innerHTML=Object.values(students).sort((a,b)=>b.timestamp.localeCompare(a.timestamp)).slice(0,100).map(s=>`<tr><td>${s.studentName||s.studentId.slice(0,8)}</td><td>${s.routeId}</td><td>${new Date(s.timestamp).toLocaleTimeString()}</td></tr>`).join("")}function openDlg(){let c=cfg();["host","port","user","pass","session"].forEach(k=>{if(c[k])$(k).value=c[k]});$("dlg").showModal()}function connect(){let c=cfg();if(!c.host||!c.user||!c.pass||!c.session)return openDlg();client?.end(true);$("conn").textContent="Connecting";client=mqtt.connect(`wss://${c.host}:${c.port}/mqtt`,{username:c.user,password:c.pass,clientId:"instructor_"+Date.now(),reconnectPeriod:1500,connectTimeout:30000});client.on("connect",()=>{$("conn").textContent="Connected";client.subscribe(topic("selection"));publish()});client.on("reconnect",()=>$("conn").textContent="Reconnecting");client.on("message",(t,m)=>{let d=JSON.parse(m);students[d.studentId]={...d,timestamp:d.timestamp||new Date().toISOString()};publish()})}$("form").onsubmit=e=>{e.preventDefault();localStorage.tpv2icfg=JSON.stringify({host:$("host").value,port:$("port").value,user:$("user").value,pass:$("pass").value,session:$("session").value});$("dlg").close();connect()};$("settings").onclick=openDlg;$("reconnect").onclick=connect;$("toggle").onclick=()=>{open=!open;publish()};$("next").onclick=()=>{round++;open=true;message="";publish()};$("pub").onclick=publish;$("reveal").onchange=e=>{reveal=e.target.checked;publish()};$("ai").onchange=e=>{showAI=e.target.checked;publish()};$("msg").onchange=e=>{message=e.target.value;publish()};$("reset").onclick=()=>{students={};inc={};round=1;open=true;client.publish(topic("control"),JSON.stringify({command:"clearSelection"}));publish()};$("route").innerHTML=base.map(r=>`<option value="${r.id}">${r.id} ${r.name}</option>`).join("");$("apply").onclick=()=>{inc[$("route").value]={label:$("itype").value,delay:+$("delay").value||20};publish()};$("clear").onclick=()=>{delete inc[$("route").value];publish()};$("close").onclick=()=>{inc[$("route").value]={label:"Road closed",closed:true};publish()};$("open").onclick=()=>{delete inc[$("route").value];publish()};render();connect();
</script></body></html>
