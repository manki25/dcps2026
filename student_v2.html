<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Route Challenge</title><script src="https://unpkg.com/mqtt@5.6.1/dist/mqtt.min.js"></script><style>
body{margin:0;font-family:system-ui;background:#07111f;color:#fff}header{padding:14px;background:#0d1b2e;position:sticky;top:0}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between}.pill{background:#334155;padding:6px 10px;border-radius:999px;font-size:12px}.hero,.map,.card,.journey{background:#0d1b2e;border:1px solid #1e3652;border-radius:18px;padding:14px;margin-bottom:12px}.muted{color:#93a4ba;font-size:13px}svg{width:100%}.edge{fill:none;stroke:#07111f;stroke-width:24;stroke-linecap:round}.road{fill:none;stroke-width:16;stroke-linecap:round}.cards{display:grid;gap:10px}.card.sel{border:2px solid #38bdf8}.rhead{display:flex;justify-content:space-between}.time{font-size:24px;font-weight:800}.badge{font-size:12px;margin:8px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}button{border:0;border-radius:10px;padding:10px 13px;background:#0ea5e9;color:white;font-weight:700}.secondary{background:#334155}.foot{display:flex;justify-content:space-between;align-items:center}.progress{height:9px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:#22c55e}footer{position:fixed;bottom:0;left:0;right:0;background:#07111fee;padding:10px}footer div{max-width:760px;margin:auto;display:flex;gap:8px}footer button:last-child{flex:1}dialog{background:#0d1b2e;color:white;border:0;border-radius:16px;width:min(500px,90%)}input{width:100%;padding:10px;margin:5px 0 10px;background:#07111f;color:white;border:1px solid #334155;border-radius:8px}
</style></head><body><header><div class="top"><b>🚦 Thane → Powai</b><span id="conn" class="pill">Offline</span></div></header><div class="wrap"><div class="hero"><b id="round">Round 1</b><h2 id="headline">Choose your route</h2><div id="message" class="muted"></div><div id="ai" style="display:none;margin-top:10px;color:#7dd3fc"></div></div><div class="map"><svg viewBox="0 0 640 410"><circle cx="320" cy="42" r="10" fill="white"/><text x="338" y="48"  font-size="24" fill="white">Thane</text><circle cx="320" cy="370" r="10" fill="white"/><text x="338" y="376"  font-size="24" fill="white">Powai</text><path class="edge" d="M320 42 C170 70 145 160 165 230 C180 280 245 330 320 370"/><path id="R1p" class="road" d="M320 42 C170 70 145 160 165 230 C180 280 245 330 320 370"/><path class="edge" d="M320 42 C450 70 500 145 475 215 C455 275 390 330 320 370"/><path id="R2p" class="road" d="M320 42 C450 70 500 145 475 215 C455 275 390 330 320 370"/><path class="edge" d="M320 42 C250 95 235 160 250 225 C265 285 285 330 320 370"/><path id="R3p" class="road" d="M320 42 C250 95 235 160 250 225 C265 285 285 330 320 370"/><path class="edge" d="M320 42 C385 95 400 160 388 225 C378 285 350 330 320 370"/><path id="R4p" class="road" d="M320 42 C385 95 400 160 388 225 C378 285 350 330 320 370"/></svg></div><div id="cards" class="cards"></div><div id="journey" class="journey" style="display:none"><b id="jt"></b><div id="jtxt" class="muted"></div><div class="progress"><div id="bar" style="width:0"></div></div></div></div><footer><div><button id="settings" class="secondary">Settings</button><button id="reconnect">Reconnect</button></div></footer><dialog id="dlg"><form id="form"><h3>Join simulation</h3><input id="host" value="mcdcc0c1.ala.asia-southeast1.emqxsl.com" placeholder="Host"><input id="port" value="8084" placeholder="Port"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><input id="session" value="CLASS01" placeholder="Session"><input id="name" placeholder="Name/Roll number"><button>Save and connect</button></form></dialog><script>
const $=x=>document.getElementById(x);let client,state={round:1,open:true,revealCounts:false,showAI:false,message:"Your choices affect everyone.",routes:[{id:"R1",name:"EEH–JVLR",travelTime:45,status:"Light",vehicles:0},{id:"R2",name:"Mulund–Airoli",travelTime:50,status:"Light",vehicles:0},{id:"R3",name:"LBS–Vikhroli",travelTime:55,status:"Light",vehicles:0},{id:"R4",name:"Ghodbunder–WEH",travelTime:65,status:"Light",vehicles:0}]},sel=localStorage.tpv2sel||"",sid=localStorage.tpv2sid||(localStorage.tpv2sid=crypto.randomUUID());function cfg(){return JSON.parse(localStorage.tpv2cfg||"{}")}function topic(k){return`dcps/traffic/${cfg().session.toUpperCase()}/${k}`}function col(s,c){if(c)return"#64748b";s=s.toLowerCase();return s.includes("light")?"#22c55e":s.includes("moderate")?"#facc15":s.includes("heavy")?"#fb923c":"#ef4444"}function render(){let best=state.routes.filter(r=>!r.closed).sort((a,b)=>a.travelTime-b.travelTime)[0];$("round").textContent=`Round ${state.round}`;$("headline").textContent=state.open?"Choose your route":"Selection closed";$("message").textContent=state.message||"";$("ai").style.display=state.showAI?"block":"none";if(best)$("ai").textContent=`🤖 AI recommends ${best.name} (${best.travelTime} min)`;state.routes.forEach(r=>$(r.id+"p").style.stroke=col(r.status,r.closed));$("cards").innerHTML=state.routes.map(r=>`<div class="card ${sel===r.id?"sel":""}"><div class="rhead"><div><b>${r.name}</b><div class="muted">${r.id}</div></div><div class="time">${r.closed?"—":r.travelTime} <small>min</small></div></div><div class="badge"><span class="dot" style="background:${col(r.status,r.closed)}"></span>${r.status}${r.incident?" · "+r.incident:""}</div><div class="foot"><span class="muted">${state.revealCounts?(r.vehicles||0)+" students":"Live estimate"}</span><button data-r="${r.id}" ${!state.open||r.closed?"disabled":""}>${sel===r.id?"Selected":"Choose"}</button></div></div>`).join("");document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>choose(b.dataset.r));if(sel){let r=state.routes.find(x=>x.id===sel);$("journey").style.display="block";$("jt").textContent=`Selected: ${r.name}`;$("jtxt").textContent=`Current estimate: ${r.travelTime} minutes`}else $("journey").style.display="none"}function choose(r){sel=r;localStorage.tpv2sel=r;render();client.publish(topic("selection"),JSON.stringify({studentId:sid,studentName:cfg().name,routeId:r,timestamp:new Date().toISOString()}),{qos:1});let p=0;clearInterval(window.tm);window.tm=setInterval(()=>{p=Math.min(100,p+2);$("bar").style.width=p+"%";if(p===100)clearInterval(window.tm)},500)}function openDlg(){let c=cfg();["host","port","user","pass","session","name"].forEach(k=>{if(c[k])$(k).value=c[k]});$("dlg").showModal()}function connect(){let c=cfg();if(!c.host||!c.user||!c.pass||!c.session||!c.name)return openDlg();client?.end(true);$("conn").textContent="Connecting";client=mqtt.connect(`wss://${c.host}:${c.port}/mqtt`,{username:c.user,password:c.pass,clientId:"student_"+sid.slice(0,12)+"_"+Date.now(),reconnectPeriod:1500,connectTimeout:30000});client.on("connect",()=>{$("conn").textContent="Connected";client.subscribe(topic("status"));client.subscribe(topic("control"))});client.on("reconnect",()=>$("conn").textContent="Reconnecting");client.on("message",(t,m)=>{let d=JSON.parse(m);if(t===topic("status")){state=d;render()}if(t===topic("control")&&d.command==="clearSelection"){sel="";delete localStorage.tpv2sel;render()}})}$("form").onsubmit=e=>{e.preventDefault();localStorage.tpv2cfg=JSON.stringify({host:$("host").value,port:$("port").value,user:$("user").value,pass:$("pass").value,session:$("session").value,name:$("name").value});$("dlg").close();connect()};$("settings").onclick=openDlg;$("reconnect").onclick=connect;render();connect();
</script></body></html>
